<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc">
  <title id="title">CI workflow and container flow</title>
  <desc id="desc">GitHub Actions builds the publisher image, runs tests, optionally checks Confluence access, and then publishes the example tree.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2e8"/>
      <stop offset="100%" stop-color="#dfeaec"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#35516a"/>
    </marker>
    <style>
      .title { font: 700 38px Helvetica, Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 500 21px Helvetica, Arial, sans-serif; fill: #486377; }
      .step { fill: #ffffff; stroke: #d8d1c8; stroke-width: 2.5; }
      .lane { fill: #eef4f5; stroke: #bfd0d4; stroke-width: 1.6; }
      .panel-title { font: 700 28px Helvetica, Arial, sans-serif; fill: #17324d; }
      .tile-title { font: 700 20px Helvetica, Arial, sans-serif; fill: #17324d; }
      .copy { font: 500 16px Helvetica, Arial, sans-serif; fill: #405b71; }
      .note { font: 500 17px Helvetica, Arial, sans-serif; fill: #617484; }
      .arrow { fill: none; stroke: #35516a; stroke-width: 5; marker-end: url(#arrow); }
      .accent-a { fill: #d67933; }
      .accent-b { fill: #2f7a78; }
      .accent-c { fill: #597a9b; }
    </style>
  </defs>

  <rect width="1500" height="840" fill="url(#bg)"/>
  <text x="750" y="66" text-anchor="middle" class="title">CI Workflow and Container Flow</text>
  <text x="750" y="102" text-anchor="middle" class="subtitle">One image runs unit tests, smoke checks, and the example publish job.</text>

  <rect x="80" y="150" width="1340" height="118" rx="24" class="lane"/>
  <text x="122" y="221" class="panel-title">GitHub Actions lane</text>

  <rect x="100" y="330" width="220" height="210" rx="24" class="step"/>
  <circle cx="146" cy="378" r="18" class="accent-a"/>
  <text x="178" y="386" class="tile-title">Checkout</text>
  <text x="128" y="432" class="copy">Fetch repository contents</text>
  <text x="128" y="456" class="copy">for the job.</text>

  <rect x="370" y="330" width="220" height="210" rx="24" class="step"/>
  <circle cx="416" cy="378" r="18" class="accent-b"/>
  <text x="448" y="386" class="tile-title">Build image</text>
  <text x="398" y="432" class="copy">Create the Docker image</text>
  <text x="398" y="456" class="copy">tagged with the commit SHA.</text>

  <rect x="640" y="330" width="220" height="210" rx="24" class="step"/>
  <circle cx="686" cy="378" r="18" class="accent-c"/>
  <text x="718" y="386" class="tile-title">Unit tests</text>
  <text x="668" y="432" class="copy">Run `unittest` inside</text>
  <text x="668" y="456" class="copy">the built container.</text>

  <rect x="910" y="330" width="230" height="210" rx="24" class="step"/>
  <circle cx="956" cy="378" r="18" class="accent-a"/>
  <text x="988" y="386" class="tile-title">Smoke test</text>
  <text x="938" y="432" class="copy">Ping the Confluence API</text>
  <text x="938" y="456" class="copy">when secrets are available.</text>

  <rect x="1190" y="330" width="230" height="210" rx="24" class="step"/>
  <circle cx="1236" cy="378" r="18" class="accent-b"/>
  <text x="1268" y="386" class="tile-title">Publish example tree</text>
  <text x="1218" y="432" class="copy">Mount `data_example/`</text>
  <text x="1218" y="456" class="copy">and `data_example_images/`.</text>

  <path d="M320 430 L370 430" class="arrow"/>
  <path d="M590 430 L640 430" class="arrow"/>
  <path d="M860 430 L910 430" class="arrow"/>
  <path d="M1140 430 L1190 430" class="arrow"/>

  <rect x="170" y="610" width="1160" height="130" rx="24" class="step"/>
  <text x="212" y="660" class="panel-title" style="font-size:24px;">Operational notes</text>
  <text x="212" y="697" class="note">Fork pull requests still run tests, but live Confluence steps are skipped because repository secrets are unavailable.</text>
  <text x="212" y="724" class="note">The same entrypoint refreshes CA certificates before every smoke test and publish run.</text>
</svg>
