<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" font-family="system-ui, Segoe UI, sans-serif">
  <rect width="820" height="280" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Page identification (invisible to readers)</text>
  <rect x="50" y="70" width="320" height="180" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="100" text-anchor="middle" font-weight="600" fill="#334155">Confluence page</text>
  <text x="70" y="130" font-size="12" fill="#475569">Title: clean (no suffix)</text>
  <text x="70" y="155" font-size="12" fill="#475569">Body: HTML from Markdown + banner</text>
  <text x="70" y="185" font-size="12" fill="#0f766e" font-weight="600">Content property (JSON)</text>
  <text x="70" y="208" font-family="ui-monospace, monospace" font-size="11" fill="#134e4a">{"publisher":"github-confluence-publisher"}</text>
  <text x="70" y="235" font-size="11" fill="#64748b">Key from config: publisher_property_key</text>
  <path d="M 385 160 L 455 160" stroke="#6366f1" stroke-width="3"/>
  <polygon points="455,160 443,154 443,166" fill="#6366f1"/>
  <rect x="470" y="70" width="300" height="180" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="620" y="105" text-anchor="middle" font-weight="600" fill="#312e81">Used for</text>
  <text x="490" y="135" font-size="12" fill="#4338ca">" CQL search before delete</text>
  <text x="490" y="160" font-size="12" fill="#4338ca">" Safe cleanup of only our pages</text>
  <text x="490" y="185" font-size="12" fill="#4338ca">" Migration fallback from legacy text pattern</text>
  <text x="490" y="215" font-size="11" fill="#6366f1">POST &/content/{id}/property after create</text>
</svg>
