<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Runtime inputs and precedence</title>
  <desc id="desc">Diagram showing YAML, environment variables, CLI credentials, mounts, and TLS settings feeding the publisher runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2e8"/>
      <stop offset="100%" stop-color="#dde9ed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#35516a"/>
    </marker>
    <style>
      .title { font: 700 38px Helvetica, Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 500 21px Helvetica, Arial, sans-serif; fill: #486377; }
      .card { fill: #ffffff; stroke: #d7d1c8; stroke-width: 2.5; }
      .small-card { fill: #f3f7f7; stroke: #bfd0d4; stroke-width: 1.7; }
      .card-title { font: 700 24px Helvetica, Arial, sans-serif; fill: #17324d; }
      .copy { font: 500 19px Helvetica, Arial, sans-serif; fill: #405b71; }
      .note { font: 500 17px Helvetica, Arial, sans-serif; fill: #627484; }
      .arrow { fill: none; stroke: #35516a; stroke-width: 5; marker-end: url(#arrow); }
      .accent-a { fill: #d67933; }
      .accent-b { fill: #2f7a78; }
      .accent-c { fill: #597a9b; }
    </style>
  </defs>

  <rect width="1400" height="780" fill="url(#bg)"/>
  <text x="700" y="66" text-anchor="middle" class="title">Runtime Inputs and Precedence</text>
  <text x="700" y="102" text-anchor="middle" class="subtitle">Local runs can read YAML first. CI and Docker rely on environment variables plus mounted content roots.</text>

  <rect x="70" y="150" width="320" height="500" rx="28" class="card"/>
  <circle cx="124" cy="208" r="18" class="accent-a"/>
  <text x="158" y="217" class="card-title">Input surfaces</text>
  <rect x="104" y="252" width="250" height="86" rx="18" class="small-card"/>
  <text x="126" y="287" class="copy">`config.yaml`</text>
  <text x="126" y="315" class="note">Used for local runs only.</text>
  <rect x="104" y="354" width="250" height="86" rx="18" class="small-card"/>
  <text x="126" y="389" class="copy">Environment variables</text>
  <text x="126" y="417" class="note">Override URL, space, roots, banner, property key.</text>
  <rect x="104" y="456" width="250" height="86" rx="18" class="small-card"/>
  <text x="126" y="491" class="copy">CLI credentials</text>
  <text x="126" y="519" class="note">`--login` and `--password` win over env credentials.</text>
  <text x="102" y="593" class="note">Credentials are required even for `--dry-run`.</text>

  <rect x="500" y="120" width="400" height="560" rx="30" class="card"/>
  <circle cx="560" cy="182" r="18" class="accent-b"/>
  <text x="596" y="191" class="card-title">Effective runtime</text>
  <rect x="540" y="228" width="320" height="92" rx="18" class="small-card"/>
  <text x="564" y="265" class="copy">`getConfig()`</text>
  <text x="564" y="296" class="note">Loads YAML, migrates typo key, normalizes the REST API base.</text>
  <rect x="540" y="340" width="320" height="92" rx="18" class="small-card"/>
  <text x="564" y="377" class="copy">`docker_entrypoint.py`</text>
  <text x="564" y="408" class="note">Refreshes CA certificates before the Python process starts.</text>
  <rect x="540" y="452" width="320" height="92" rx="18" class="small-card"/>
  <text x="564" y="489" class="copy">Mounted content roots</text>
  <text x="564" y="520" class="note">Default container roots are `/app/data` and `/app/data_images`.</text>
  <text x="538" y="593" class="note">Docker image note: `publisher/config/config.yaml` is not copied into the image.</text>
  <text x="538" y="621" class="note">That is why CI depends on env vars, not bundled config files.</text>

  <rect x="1010" y="150" width="320" height="500" rx="28" class="card"/>
  <circle cx="1064" cy="208" r="18" class="accent-c"/>
  <text x="1098" y="217" class="card-title">Outputs and safeguards</text>
  <rect x="1044" y="252" width="250" height="86" rx="18" class="small-card"/>
  <text x="1066" y="287" class="copy">Normalized Confluence target</text>
  <text x="1066" y="315" class="note">Space key, parent id, and REST API base are ready to use.</text>
  <rect x="1044" y="354" width="250" height="86" rx="18" class="small-card"/>
  <text x="1066" y="389" class="copy">TLS trust store</text>
  <text x="1066" y="417" class="note">System CA store plus any mounted custom certificates.</text>
  <rect x="1044" y="456" width="250" height="86" rx="18" class="small-card"/>
  <text x="1066" y="491" class="copy">Resolved content roots</text>
  <text x="1066" y="519" class="note">Markdown and image directories are ready for the publish walk.</text>
  <text x="1042" y="593" class="note">Banner fields, property key, and legacy cleanup pattern also come through here.</text>

  <path d="M390 360 C440 360 450 360 500 360" class="arrow"/>
  <path d="M900 400 C950 400 960 400 1010 400" class="arrow"/>

  <rect x="315" y="708" width="770" height="44" rx="16" fill="#17324d" opacity="0.93"/>
  <text x="700" y="737" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f8f4ed">Rule of thumb: local runs may start with YAML; automated runs should assume env-first configuration.</text>
</svg>
