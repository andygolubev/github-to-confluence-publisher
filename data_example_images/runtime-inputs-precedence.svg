<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc">
  <title id="title">Runtime inputs and precedence</title>
  <desc id="desc">Local runs may start with YAML, but CI and container runs rely on environment variables and mounted roots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2e8"/>
      <stop offset="100%" stop-color="#dde9ed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#35516a"/>
    </marker>
    <style>
      .title { font: 700 38px Helvetica, Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 500 21px Helvetica, Arial, sans-serif; fill: #486377; }
      .panel { fill: #ffffff; stroke: #d7d1c8; stroke-width: 2.5; }
      .tile { fill: #f3f7f7; stroke: #bfd0d4; stroke-width: 1.7; }
      .panel-title { font: 700 28px Helvetica, Arial, sans-serif; fill: #17324d; }
      .tile-title { font: 700 20px Helvetica, Arial, sans-serif; fill: #405b71; }
      .copy { font: 500 16px Helvetica, Arial, sans-serif; fill: #627484; }
      .note { font: 500 17px Helvetica, Arial, sans-serif; fill: #4d6579; }
      .arrow { fill: none; stroke: #35516a; stroke-width: 5; marker-end: url(#arrow); }
      .accent-a { fill: #d67933; }
      .accent-b { fill: #2f7a78; }
      .accent-c { fill: #597a9b; }
    </style>
  </defs>

  <rect width="1500" height="840" fill="url(#bg)"/>
  <text x="750" y="66" text-anchor="middle" class="title">Runtime Inputs and Precedence</text>
  <text x="750" y="102" text-anchor="middle" class="subtitle">Local runs may read YAML first. CI and Docker runs are env-first.</text>

  <rect x="70" y="150" width="380" height="560" rx="28" class="panel"/>
  <circle cx="126" cy="208" r="18" class="accent-a"/>
  <text x="160" y="218" class="panel-title">Input surfaces</text>
  <rect x="106" y="258" width="308" height="92" rx="18" class="tile"/>
  <text x="132" y="294" class="tile-title">`config.yaml`</text>
  <text x="132" y="321" class="copy">Local runs may start here.</text>
  <rect x="106" y="372" width="308" height="92" rx="18" class="tile"/>
  <text x="132" y="408" class="tile-title">Environment variables</text>
  <text x="132" y="435" class="copy">Override URL, space, roots,</text>
  <text x="132" y="458" class="copy">banner, and property key.</text>
  <rect x="106" y="486" width="308" height="92" rx="18" class="tile"/>
  <text x="132" y="522" class="tile-title">CLI credentials</text>
  <text x="132" y="549" class="copy">`--login` and `--password`</text>
  <text x="132" y="572" class="copy">override env credentials.</text>
  <text x="104" y="642" class="note">Credentials are still required for `--dry-run`.</text>

  <rect x="560" y="120" width="380" height="590" rx="30" class="panel"/>
  <circle cx="616" cy="178" r="18" class="accent-b"/>
  <text x="650" y="188" class="panel-title">Effective runtime</text>
  <rect x="596" y="228" width="308" height="96" rx="18" class="tile"/>
  <text x="622" y="264" class="tile-title">`getConfig()`</text>
  <text x="622" y="291" class="copy">Load YAML, migrate the typo key,</text>
  <text x="622" y="314" class="copy">and normalize the REST API base.</text>
  <rect x="596" y="344" width="308" height="96" rx="18" class="tile"/>
  <text x="622" y="380" class="tile-title">`docker_entrypoint.py`</text>
  <text x="622" y="407" class="copy">Refresh CA certificates before</text>
  <text x="622" y="430" class="copy">the Python process starts.</text>
  <rect x="596" y="460" width="308" height="96" rx="18" class="tile"/>
  <text x="622" y="496" class="tile-title">Mounted content roots</text>
  <text x="622" y="523" class="copy">Container defaults are `/app/data`</text>
  <text x="622" y="546" class="copy">and `/app/data_images`.</text>
  <text x="594" y="618" class="note">The image does not ship `config.yaml`.</text>
  <text x="594" y="643" class="note">That is why CI depends on env vars.</text>

  <rect x="1050" y="150" width="380" height="560" rx="28" class="panel"/>
  <circle cx="1106" cy="208" r="18" class="accent-c"/>
  <text x="1140" y="218" class="panel-title">Resolved outputs</text>
  <rect x="1086" y="258" width="308" height="92" rx="18" class="tile"/>
  <text x="1112" y="294" class="tile-title">Target settings</text>
  <text x="1112" y="321" class="copy">Space key, parent id, and</text>
  <text x="1112" y="344" class="copy">REST API base are ready to use.</text>
  <rect x="1086" y="372" width="308" height="92" rx="18" class="tile"/>
  <text x="1112" y="408" class="tile-title">TLS trust store</text>
  <text x="1112" y="435" class="copy">System CAs plus any mounted</text>
  <text x="1112" y="458" class="copy">custom certificates.</text>
  <rect x="1086" y="486" width="308" height="92" rx="18" class="tile"/>
  <text x="1112" y="522" class="tile-title">Content roots</text>
  <text x="1112" y="549" class="copy">Markdown and image directories</text>
  <text x="1112" y="572" class="copy">are ready for the publish walk.</text>
  <text x="1084" y="642" class="note">Banner values, property key, and the</text>
  <text x="1084" y="667" class="note">legacy search pattern resolve here too.</text>

  <path d="M450 410 C500 410 510 410 560 410" class="arrow"/>
  <path d="M940 410 C990 410 1000 410 1050 410" class="arrow"/>
</svg>
