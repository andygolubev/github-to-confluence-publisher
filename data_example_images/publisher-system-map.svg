<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Publisher system map</title>
  <desc id="desc">Repository inputs pass through the publisher runtime and become Confluence pages, attachments, and properties.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e7"/>
      <stop offset="100%" stop-color="#dbe7ea"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#38536b"/>
    </marker>
    <style>
      .title { font: 700 38px Helvetica, Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 500 21px Helvetica, Arial, sans-serif; fill: #415a70; }
      .panel { fill: #ffffff; stroke: #d7d2c8; stroke-width: 2.5; }
      .tile { fill: #f1f6f7; stroke: #b8cad0; stroke-width: 1.5; }
      .panel-title { font: 700 28px Helvetica, Arial, sans-serif; fill: #17324d; }
      .tile-title { font: 700 20px Helvetica, Arial, sans-serif; fill: #355066; }
      .copy { font: 500 16px Helvetica, Arial, sans-serif; fill: #5d6f7f; }
      .note { font: 500 17px Helvetica, Arial, sans-serif; fill: #4d6579; }
      .accent-a { fill: #db7f3b; }
      .accent-b { fill: #2f7a78; }
      .accent-c { fill: #587a9b; }
      .arrow { fill: none; stroke: #38536b; stroke-width: 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="860" fill="url(#bg)"/>
  <text x="750" y="72" text-anchor="middle" class="title">Publisher System Map</text>
  <text x="750" y="108" text-anchor="middle" class="subtitle">Git content becomes Confluence pages through one batch sync run.</text>

  <rect x="70" y="155" width="380" height="570" rx="30" class="panel"/>
  <circle cx="126" cy="214" r="18" class="accent-a"/>
  <text x="160" y="224" class="panel-title">Repository Inputs</text>
  <rect x="106" y="260" width="308" height="104" rx="20" class="tile"/>
  <text x="132" y="298" class="tile-title">Markdown tree</text>
  <text x="132" y="327" class="copy">`data_example/` becomes the</text>
  <text x="132" y="350" class="copy">published page hierarchy.</text>
  <rect x="106" y="386" width="308" height="104" rx="20" class="tile"/>
  <text x="132" y="424" class="tile-title">Image root</text>
  <text x="132" y="453" class="copy">`data_example_images/`</text>
  <text x="132" y="476" class="copy">supplies attachment files.</text>
  <rect x="106" y="512" width="308" height="104" rx="20" class="tile"/>
  <text x="132" y="550" class="tile-title">Config and CI</text>
  <text x="132" y="579" class="copy">YAML, env vars, Dockerfile,</text>
  <text x="132" y="602" class="copy">and Actions define runtime.</text>
  <text x="104" y="670" class="note">Git remains the source of truth.</text>

  <rect x="560" y="125" width="380" height="600" rx="30" class="panel"/>
  <circle cx="616" cy="184" r="18" class="accent-b"/>
  <text x="650" y="194" class="panel-title">Publisher Runtime</text>
  <rect x="596" y="232" width="308" height="94" rx="20" class="tile"/>
  <text x="622" y="268" class="tile-title">`main.py`</text>
  <text x="622" y="296" class="copy">Credentials, dry-run,</text>
  <text x="622" y="319" class="copy">and top-level orchestration.</text>
  <rect x="596" y="344" width="308" height="94" rx="20" class="tile"/>
  <text x="622" y="380" class="tile-title">`getconfig.py`</text>
  <text x="622" y="408" class="copy">Load YAML, normalize URL,</text>
  <text x="622" y="431" class="copy">and apply env overrides.</text>
  <rect x="596" y="456" width="308" height="94" rx="20" class="tile"/>
  <text x="622" y="492" class="tile-title">`pagesPublisher.py`</text>
  <text x="622" y="520" class="copy">Walk folders, convert Markdown,</text>
  <text x="622" y="543" class="copy">and upload attachments.</text>
  <rect x="596" y="568" width="308" height="94" rx="20" class="tile"/>
  <text x="622" y="604" class="tile-title">`pagesController.py`</text>
  <text x="622" y="632" class="copy">Verify, search, upsert,</text>
  <text x="622" y="655" class="copy">tag, attach, and delete.</text>

  <rect x="1050" y="155" width="380" height="570" rx="30" class="panel"/>
  <circle cx="1106" cy="214" r="18" class="accent-c"/>
  <text x="1140" y="224" class="panel-title">Confluence Target</text>
  <rect x="1086" y="260" width="308" height="104" rx="20" class="tile"/>
  <text x="1112" y="298" class="tile-title">Folder pages</text>
  <text x="1112" y="327" class="copy">Directories become children</text>
  <text x="1112" y="350" class="copy">macro navigation pages.</text>
  <rect x="1086" y="386" width="308" height="104" rx="20" class="tile"/>
  <text x="1112" y="424" class="tile-title">Markdown pages</text>
  <text x="1112" y="453" class="copy">Each `.md` file becomes</text>
  <text x="1112" y="476" class="copy">one content page.</text>
  <rect x="1086" y="512" width="308" height="104" rx="20" class="tile"/>
  <text x="1112" y="550" class="tile-title">Attachments and tags</text>
  <text x="1112" y="579" class="copy">Uploaded files plus hidden</text>
  <text x="1112" y="602" class="copy">publisher properties.</text>
  <text x="1084" y="670" class="note">All content hangs under one parent page.</text>

  <path d="M450 430 C500 430 510 430 560 430" class="arrow"/>
  <path d="M940 430 C990 430 1000 430 1050 430" class="arrow"/>

  <rect x="280" y="760" width="940" height="64" rx="20" fill="#17324d" opacity="0.92"/>
  <text x="750" y="790" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f9f6ef">Current sync model</text>
  <text x="750" y="814" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#f9f6ef">verify the parent, upsert the current tree, then prune stale generated ids</text>
</svg>
