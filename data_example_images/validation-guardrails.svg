<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc">
  <title id="title">Validation and guardrails</title>
  <desc id="desc">The publisher validates configuration, verifies the parent page, keeps TLS strict, and checks API payloads before trusting them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2e8"/>
      <stop offset="100%" stop-color="#dfeaec"/>
    </linearGradient>
    <style>
      .title { font: 700 38px Helvetica, Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 500 21px Helvetica, Arial, sans-serif; fill: #486377; }
      .card { fill: #ffffff; stroke: #d8d1c8; stroke-width: 2.5; }
      .soft { fill: #eef4f5; stroke: #bfd0d4; stroke-width: 1.6; }
      .warn { fill: #fcf4eb; stroke: #e9c49f; stroke-width: 1.6; }
      .good { fill: #eef7f3; stroke: #bcd8cc; stroke-width: 1.6; }
      .panel-title { font: 700 26px Helvetica, Arial, sans-serif; fill: #17324d; }
      .tile-title { font: 700 20px Helvetica, Arial, sans-serif; fill: #17324d; }
      .copy { font: 500 16px Helvetica, Arial, sans-serif; fill: #405b71; }
      .note { font: 500 17px Helvetica, Arial, sans-serif; fill: #617484; }
    </style>
  </defs>

  <rect width="1500" height="840" fill="url(#bg)"/>
  <text x="750" y="66" text-anchor="middle" class="title">Validation and Guardrails</text>
  <text x="750" y="102" text-anchor="middle" class="subtitle">Bad inputs fail early. Valid inputs still go through strict transport and payload checks.</text>

  <rect x="110" y="170" width="400" height="180" rx="24" class="card"/>
  <rect x="142" y="208" width="336" height="108" rx="18" class="soft"/>
  <text x="168" y="248" class="tile-title">Credentials and config</text>
  <text x="168" y="278" class="copy">Reject empty login or token.</text>
  <text x="168" y="302" class="copy">Validate space keys and numeric parent ids.</text>

  <rect x="550" y="170" width="400" height="180" rx="24" class="card"/>
  <rect x="582" y="208" width="336" height="108" rx="18" class="soft"/>
  <text x="608" y="248" class="tile-title">URL normalization</text>
  <text x="608" y="278" class="copy">Turn wiki URLs into the REST API base.</text>
  <text x="608" y="302" class="copy">Cloud and server-style paths are covered.</text>

  <rect x="990" y="170" width="400" height="180" rx="24" class="card"/>
  <rect x="1022" y="208" width="336" height="108" rx="18" class="warn"/>
  <text x="1048" y="248" class="tile-title">Parent page verification</text>
  <text x="1048" y="278" class="copy">Fail before writes when the ancestor</text>
  <text x="1048" y="302" class="copy">page is missing or misconfigured.</text>

  <rect x="110" y="390" width="400" height="180" rx="24" class="card"/>
  <rect x="142" y="428" width="336" height="108" rx="18" class="good"/>
  <text x="168" y="468" class="tile-title">TLS handling</text>
  <text x="168" y="498" class="copy">Use the system trust store only.</text>
  <text x="168" y="522" class="copy">Mounted custom CAs are picked up first.</text>

  <rect x="550" y="390" width="400" height="180" rx="24" class="card"/>
  <rect x="582" y="428" width="336" height="108" rx="18" class="warn"/>
  <text x="608" y="468" class="tile-title">Response validation</text>
  <text x="608" y="498" class="copy">Detect HTML where JSON was expected.</text>
  <text x="608" y="522" class="copy">Pydantic models catch schema drift.</text>

  <rect x="990" y="390" width="400" height="180" rx="24" class="card"/>
  <rect x="1022" y="428" width="336" height="108" rx="18" class="good"/>
  <text x="1048" y="468" class="tile-title">Tests and defaults</text>
  <text x="1048" y="498" class="copy">Unit tests cover config, search, updates,</text>
  <text x="1048" y="522" class="copy">and image extraction.</text>

  <rect x="250" y="640" width="1000" height="112" rx="24" class="card"/>
  <text x="750" y="686" text-anchor="middle" class="panel-title">Result</text>
  <text x="750" y="718" text-anchor="middle" class="note">Wrong inputs produce targeted failures.</text>
  <text x="750" y="744" text-anchor="middle" class="note">Valid runs keep TLS strict and verify API payloads before trusting them.</text>
</svg>
