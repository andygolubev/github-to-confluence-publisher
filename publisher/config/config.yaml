# Confluence publisher configuration.
#
# Every value here can be overridden by the corresponding environment variable
# (see README for the full list). When running via Docker or GitHub Actions you
# can skip this file entirely and set everything through env vars.

confluence_url: https://yoursite.atlassian.net/wiki/rest/api/
confluence_space: MYSPACE
confluence_parent_page_id: 123456

# Content property key used to tag and later find pages created by this tool.
publisher_property_key: autogenerated-publisher

banner_repo_url: https://github.com/your-org/your-repo
banner_project_name: My project

github_folder_with_md_files: ./data_example
github_folder_with_image_files: ./data_example_images
