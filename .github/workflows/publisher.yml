# Required repository variables (Settings → Secrets and variables → Actions → Variables):
#   CONFLUENCE_URL              — e.g. https://yoursite.atlassian.net/wiki/rest/api/
#   CONFLUENCE_SPACE            — e.g. MYSPACE
#   CONFLUENCE_PARENT_PAGE_ID   — e.g. 123456
#   BANNER_PROJECT_NAME         — (optional, defaults to repo name)
#   PUBLISHER_PROPERTY_KEY      — (optional, defaults to autogenerated-publisher)
#
# Required repository secrets:
#   confluence_login             — Atlassian account email
#   confluence_api_token         — Atlassian API token

name: Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  publish:

    runs-on: ubuntu-latest

    # Repository/org secrets are empty on pull_request workflows from forks — skip Confluence steps there.
    # Set all values below via repository variables/secrets (Settings → Secrets and variables → Actions).
    env:
      CONFLUENCE_URL: https://testbot.atlassian.net/wiki/rest/api/
      CONFLUENCE_SPACE: newpublish
      CONFLUENCE_PARENT_PAGE_ID: "3866792"
      PUBLISHER_PROPERTY_KEY: autogenerated-publisher
      CONFLUENCE_LOGIN: ${{ secrets.confluence_login }}
      CONFLUENCE_API_TOKEN: ${{ secrets.confluence_api_token }}
      BANNER_REPO_URL: https://github.com/${{ github.repository }}
      BANNER_PROJECT_NAME: ${{ vars.BANNER_PROJECT_NAME || github.event.repository.name }}
      PUBLISHER_MARKDOWN_ROOT: /app/data
      PUBLISHER_IMAGES_ROOT: /app/data_images

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build publisher image
      run: docker build -t confluence-publisher:${{ github.sha }} .

    - name: Run unit tests
      run: |
        docker run --rm \
          --entrypoint python \
          confluence-publisher:${{ github.sha }} \
          -m unittest discover -s /app/publisher -p "test_*.py" -v

    - name: Verify Confluence API connection
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
      run: |
        docker run --rm \
          --entrypoint python \
          -e CONFLUENCE_URL \
          -e CONFLUENCE_SPACE \
          -e CONFLUENCE_PARENT_PAGE_ID \
          -e CONFLUENCE_LOGIN \
          -e CONFLUENCE_API_TOKEN \
          -e BANNER_REPO_URL \
          -e BANNER_PROJECT_NAME \
          -e PUBLISHER_PROPERTY_KEY \
          confluence-publisher:${{ github.sha }} \
          /app/publisher/test_atlassian_connection.py

    - name: Publish MD files to the Confluence space
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
      run: |
        docker run --rm \
          -e CONFLUENCE_URL \
          -e CONFLUENCE_SPACE \
          -e CONFLUENCE_PARENT_PAGE_ID \
          -e CONFLUENCE_LOGIN \
          -e CONFLUENCE_API_TOKEN \
          -e BANNER_REPO_URL \
          -e BANNER_PROJECT_NAME \
          -e PUBLISHER_PROPERTY_KEY \
          -e PUBLISHER_MARKDOWN_ROOT \
          -e PUBLISHER_IMAGES_ROOT \
          -v "${{ github.workspace }}/data_example:/app/data:ro" \
          -v "${{ github.workspace }}/data_example_images:/app/data_images:ro" \
          confluence-publisher:${{ github.sha }}
